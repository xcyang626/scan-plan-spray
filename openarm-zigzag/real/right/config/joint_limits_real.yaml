# 真机动力学限位(2026-09-04 调整):
# 速度/加速度设为温和值, MoveIt 规划的关节空间移动(回家/去起点等)
# 以约 0.1-0.2 rad/s 的慢速执行, 与 move_small 微动同量级。
# 位置限位不在此处——真机 URDF 的 limit 已由 gen_real_config.py 写入
